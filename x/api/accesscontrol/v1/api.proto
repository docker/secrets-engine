edition = "2023";

package accesscontrol.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/docker/secrets-engine/x/api/accesscontrol/v1;accesscontrolv1";

service AccessControlService {
  // Decides whether the requester may resolve the queried secrets.
  // Called for every GetSecrets request.
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);

  // Preflight: authorizes the requester ahead of use, valid until the
  // returned expiry.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

message CheckAccessRequest {
  // Patterns the caller wants to resolve; at least one required.
  repeated string patterns = 1;

  Requester requester = 2;
}

message AuthorizeRequest {
  // Patterns the caller wants authorized; at least one required.
  repeated string patterns = 1;

  Requester requester = 2;
}

message AuthorizeResponse {
  // When the authorization expires.
  google.protobuf.Timestamp expires_at = 1;
}

message Requester {
  int32 pid = 1;
  string name = 2;
  string absolute_binary_path = 3;
  // Signature chains to Docker's signing identity.
  bool signed_by_docker = 4;

  // Platform-specific signing context, per host OS.
  oneof signing_info {
    DarwinSigningInfo darwin = 5;
    WindowsSigningInfo windows = 6;
    LinuxSigningInfo linux = 7;
  }
}

// macOS code-signing context (SecCode* APIs) for the requester and its
// process ancestry.
message DarwinSigningInfo {
  // Identity of the outermost recorded ancestor.
  SigningIdentity root = 1;
  // Identity of the process that connected to the socket.
  SigningIdentity leaf = 2;
  // Ancestry ordered root to leaf; may be a single node.
  repeated ProcessNode chain = 3;

  // Root the certificate chain reaches, ordered by increasing trust
  // (gate on a minimum).
  enum Anchor {
    // Unsigned.
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    ANCHOR_NONE = 0;
    // Ad-hoc: a cdhash but no certificate (Homebrew formula, dev build).
    ANCHOR_AD_HOC = 1;
    // Chain does not reach an Apple root.
    ANCHOR_OTHER = 2;
    // Developer ID or Mac App Store.
    ANCHOR_APPLE_GENERIC = 3;
    // Apple platform binaries.
    ANCHOR_APPLE_PLATFORM = 4;
  }

  // Verified code-signing identity of one process.
  message SigningIdentity {
    // Team Identifier (kSecCodeInfoTeamIdentifier); unique per developer
    // account — reliable trust key.
    string team_id = 1;
    // Code-signing identifier (kSecCodeInfoIdentifier), typically the
    // bundle ID; pins an app within a team.
    string identifier = 2;
    // Leaf cert subject.O, e.g. "Docker Inc"; display only, not a trust key.
    string organization = 3;
    // Leaf cert subject.CN; display only.
    string common_name = 4;
    // Code directory hash (kSecCodeInfoUnique), hex; pins an exact build.
    string cd_hash = 5;
    // Dynamic code-signing status word (kSecCodeInfoStatus) — the kernel's
    // live view of the signature. Raw uint32 bitmask; values are fixed by
    // Apple's <Security/SecCode.h> and preserved verbatim (unknown bits
    // included). Known flags:
    //   0x0000_0001 VALID    — dynamically valid; cleared on runtime tamper.
    //   0x0000_0100 HARD     — kernel refuses to page in invalid pages.
    //   0x0000_0200 KILL     — process killed if it becomes invalid.
    //   0x1000_0000 DEBUGGED — debugger attached; red flag for a secrets peer.
    uint32 status = 6;
    // Root the certificate chain reaches.
    Anchor anchor = 7;
    // Signature chains to Docker's signing identity.
    bool signed_by_docker = 8;
    // App name from Info.plist (CFBundleDisplayName or CFBundleName);
    // display only.
    string bundle_name = 9;
  }

  // One process in the ancestry chain.
  message ProcessNode {
    int32 pid = 1;
    // Start time in µs since epoch; with pid, survives PID reuse.
    int64 start = 2;
    // Effective uid; -1 when unknown.
    int32 uid = 3;
    // Kernel process name (p_comm, 16 chars max).
    string comm = 4;
    // Executable path (proc_pidpath).
    string exe = 5;
    // exe with symlinks resolved; falls back to exe.
    string real_exe = 6;
    // Modification time of real_exe, UTC.
    google.protobuf.Timestamp mtime = 7;
    // argv via sysctl(KERN_PROCARGS2); best-effort, self-reported.
    repeated string args = 8;
  }
}

// Windows Authenticode context for the requesting process.
message WindowsSigningInfo {
  // Signature-derived, verified by WinVerifyTrust (primary signature only).

  // Chains to a trusted root and not revoked; remaining signature fields
  // are meaningful only when true.
  bool trusted_chain = 1;
  string subject_org = 2;
  string subject_common_name = 3;
  // Issuing CA Common Name.
  string issuer = 4;
  // SHA-256 of the leaf certificate, hex; strongest pin, breaks on rotation.
  string thumbprint_sha256 = 5;
  // Extended Validation certificate (CA/Browser Forum EV policy OID).
  bool is_ev = 6;

  // Integrity level from the peer's access token; diagnostics only,
  // never gated on.
  IntegrityLevel integrity = 7;

  // PE VERSIONINFO (unsigned, attacker-controllable): display only,
  // never gate trust.
  string company_name = 8;
  string product_name = 9;
  string file_version = 10;

  // Windows mandatory integrity level (winnt.h RIDs); higher = more
  // privileged.
  enum IntegrityLevel {
    // Untrusted, or could not be determined.
    INTEGRITY_LEVEL_UNSPECIFIED = 0;
    // SECURITY_MANDATORY_LOW_RID (0x1000), e.g. AppContainer/sandboxed.
    INTEGRITY_LEVEL_LOW = 0x1000;
    // SECURITY_MANDATORY_MEDIUM_RID (0x2000), default for standard user procs.
    INTEGRITY_LEVEL_MEDIUM = 0x2000;
    // SECURITY_MANDATORY_HIGH_RID (0x3000), e.g. elevated (administrator).
    INTEGRITY_LEVEL_HIGH = 0x3000;
    // SECURITY_MANDATORY_SYSTEM_RID (0x4000), e.g. services running as SYSTEM.
    INTEGRITY_LEVEL_SYSTEM = 0x4000;
  }
}

// Sigstore (Fulcio/Rekor) context for the requesting process. A binary may
// have multiple signers.
message LinuxSigningInfo {
  repeated Signer signers = 1;

  // One verified sigstore signature over the binary.
  message Signer {
    // OIDC issuer in the Fulcio cert, e.g.
    // "https://token.actions.githubusercontent.com".
    string cert_issuer = 1;
    // Certificate SAN — the signer's workflow identity.
    string cert_identity = 2;
    string source_repo = 3;

    // Provenance bound in the cert (diagnostic, not gated).

    // Git ref built, e.g. "refs/tags/v0.7.1".
    string source_ref = 4;
    string source_commit = 5;
    // "github-hosted" or "self-hosted".
    string runner_environment = 6;
    // Workflow trigger event, e.g. "release".
    string build_trigger = 7;
    // GitHub Actions run that produced the signature.
    string run_invocation_uri = 8;

    // Verified Rekor inclusion.

    // Entry's index in the Rekor transparency log.
    int64 rekor_log_index = 9;
    // When recorded in Rekor.
    google.protobuf.Timestamp integrated_time = 10;
  }
}

enum Decision {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  DECISION_DENY  = 0;
  DECISION_ALLOW = 1;
}

message CheckAccessResponse {
  Decision decision = 1;
}
