# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: x/api/
lint:
  use:
    - STANDARD
  ignore_only:
    # management.proto generates its messages into client/api/plugins/v1.
    PACKAGE_SAME_GO_PACKAGE:
      - x/api/plugins/v1
breaking:
  use:
    - FILE
