version: v2
managed:
  enabled: true
plugins:
  # For latest version, see: https://github.com/protocolbuffers/protobuf-go/tags
  # Placed by go_package, so the client-facing messages land in client/api.
  - remote: buf.build/protocolbuffers/go:v1.36.7
    out: .
    opt:
      - module=github.com/docker/secrets-engine
      - default_api_level=API_OPAQUE
  # Run from source. Writes the service clients and handlers beside the proto files.
  - local: ["go", "run", "./plugin/internal/protoc-gen-go-rpc"]
    out: plugin/api
    opt:
      - paths=source_relative
